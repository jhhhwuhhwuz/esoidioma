var BK_TALES=[{"id":"t1","lv":"A1","t":"El gato naranja","au":"Notas Reader","d":"قصة بسيطة عن فتاة في مدريد تبحث عن قطّها المفقود.","ch":[{"h":"Un gato desaparecido","p":["Lucía vive en Madrid, en un piso pequeño. Tiene un gato naranja que se llama Tango. Cada mañana, Tango come y duerme en la ventana. Hoy, la ventana está abierta y el gato no está.","Lucía busca en la cocina, en el baño y debajo de la cama. No está en ningún sitio. Ella está triste y un poco nerviosa. Sale de casa y mira en la calle."]},{"h":"En el parque","p":["En el parque hay muchos niños y muchos perros. Lucía pregunta a un señor mayor: «Perdone, ¿ve un gato naranja?» El señor sonríe y dice: «No, pero busca cerca del mercado».","Lucía camina hasta el mercado. Huele a pan y a fruta. Una mujer vende pescado, y delante de su mesa hay un gato naranja. ¡Es Tango!"]},{"h":"Una buena noticia","p":["Lucía corre y abraza al gato. «¡Tango, aquí estás!», dice. El gato tiene hambre y mira el pescado. La vendedora ríe y le da un trozo pequeño.","Lucía da las gracias a la mujer. Después vuelve a casa con Tango en los brazos. Cierra la ventana y prepara la cena. Los dos están muy contentos esta noche."]}],"gl":{"ventana":"نافذة","cocina":"مطبخ","baño":"حمّام","triste":"حزينة","mercado":"سوق","pescado":"سمك","abraza":"تعانق","hambre":"جوع","vendedora":"بائعة","brazos":"ذراعان","cierra":"تُغلق"}},{"id":"t2","lv":"A2","t":"El paraguas amarillo","au":"Notas Reader","d":"صباح ممطر في فالبارايسو يغيّر يوم ماتيو وجدّته.","ch":[{"h":"Una mañana de lluvia","p":["Era una mañana gris en Valparaíso y llovía mucho. Mateo, un chico de doce años, salió de casa con el paraguas de su abuela, que era grande y amarillo. Tenía que comprar pan y tomates en el mercado del cerro.","Las calles estaban llenas de agua y el viento movía los carteles de las tiendas. Mateo caminaba despacio para no caerse. De repente, vio a una señora sentada en un banco, sin paraguas y con la ropa mojada."]},{"h":"La señora del banco","p":["Mateo se acercó y le preguntó: «¿Está usted bien, señora?» Ella sonrió con tristeza y contestó que esperaba a su hijo, pero que el autobús llegaba tarde. Llevaba allí casi una hora.","El chico no lo pensó mucho. Abrió el paraguas amarillo y se sentó a su lado. Hablaron de la lluvia, del puerto y de las casas de colores. La señora se llamaba Rosa y conocía la historia de cada calle."]},{"h":"Una sorpresa","p":["Cuando por fin llegó el autobús, un hombre bajó corriendo y abrazó a Rosa. Era su hijo, que volvía de un viaje largo. Rosa le presentó a Mateo y le dijo que aquel niño era muy amable.","Al día siguiente, Rosa visitó a la abuela de Mateo con una caja de galletas. Resultó que las dos señoras eran viejas amigas del colegio y no se veían desde hacía treinta años. Mateo, feliz, comió tres galletas."]}],"gl":{"paraguas":"مظلّة","llovía":"كانت تمطر","cerro":"تلّة","carteles":"لافتات","mojada":"مبلّلة","tristeza":"حزن","esperaba":"كانت تنتظر","puerto":"ميناء","corriendo":"راكضًا","abrazó":"عانق","viaje":"رحلة","amable":"لطيف","galletas":"بسكويت","colegio":"مدرسة"}},{"id":"t3","lv":"B1","t":"La maleta equivocada","au":"Notas Reader","d":"مصادفة في قطار متّجه إلى إشبيلية تقود كارمن إلى مساء لا يُنسى.","ch":[{"h":"En la estación","p":["Carmen llegó a la estación de Atocha con el tiempo justo. Había pasado la noche trabajando en un informe y estaba tan cansada que apenas veía por dónde caminaba. Cogió su maleta gris del suelo, subió al tren y se dejó caer en el asiento junto a la ventanilla.","Cuando el tren ya había salido de Madrid, abrió la maleta para sacar el ordenador. Dentro no había ni ordenador ni ropa suya, sino cuadernos de partituras, una bufanda roja y una flauta. Se había llevado la maleta de otra persona, y no tenía ni idea de quién era."]},{"h":"Una nota inesperada","p":["Entre las partituras encontró una tarjeta con un nombre, Andrés Olmedo, y un número de teléfono. Llamó con el corazón acelerado, pero nadie contestó. Un hombre sentado enfrente, que había observado la escena en silencio, le ofreció un café del vagón cafetería para tranquilizarla.","Charlaron durante horas. El hombre, que resultó ser un revisor jubilado, le contó que en treinta años había visto de todo: paraguas olvidados, perros dormidos, incluso un violonchelo. «Casi siempre, las cosas perdidas vuelven a su dueño», dijo. «Solo hace falta un poco de paciencia»."]},{"h":"El final del viaje","p":["Al llegar a Sevilla, Carmen se dirigió a la oficina de objetos perdidos. Allí, de pie junto al mostrador, esperaba un joven con cara de preocupación y una maleta gris idéntica a la suya. Se miraron un segundo y los dos rompieron a reír.","Andrés, que era músico, llevaba semanas preparando un concierto y no sabía cómo iba a tocar sin su flauta. Intercambiaron las maletas y, para agradecérselo, él la invitó a su concierto esa misma noche. Carmen, que pensaba volver a Madrid, cambió de planes sin dudarlo."]}],"gl":{"informe":"تقرير","cansada":"متعبة","maleta":"حقيبة سفر","asiento":"مقعد","ventanilla":"نافذة القطار","partituras":"نوتات موسيقية","bufanda":"وشاح","flauta":"ناي","tarjeta":"بطاقة","acelerado":"متسارع","enfrente":"أمامها","vagón":"عربة قطار","revisor":"مفتّش التذاكر","jubilado":"متقاعد","paciencia":"صبر","mostrador":"منضدة","preocupación":"قلق","idéntica":"مطابقة","intercambiaron":"تبادلوا","agradecérselo":"شكره على ذلك"}},{"id":"t4","lv":"B2","t":"El olivar de Jaén","au":"Notas Reader","d":"ميراث غير متوقّع من عمٍّ مخاصم يضع إيلينا أمام قرار يخصّ ماضيها.","ch":[{"h":"Una herencia inesperada","p":["Cuando el notario le comunicó que su tío Ramón le había dejado un olivar en las afueras de Jaén, Elena no supo si reír o enfadarse. Hacía veinte años que no hablaban, desde la discusión que había dividido a la familia, y jamás habría imaginado que él se acordara de ella.","Aun así, tomó el primer tren hacia el sur. El camino hasta la finca, entre colinas cubiertas de árboles retorcidos, le devolvió recuerdos de veranos lejanos. La casa, aunque deteriorada, seguía en pie, y en la puerta alguien había clavado una nota que decía simplemente: «Por fin»."]},{"h":"Lo que guardaba la cocina","p":["Dentro olía a humedad y a aceite viejo. En un aparador, entre manteles amarillentos, Elena halló un cuaderno de tapas gastadas donde su tío había anotado, año tras año, la cosecha, el tiempo y, de vez en cuando, una frase dirigida a ella: «Quizá este año venga a ayudarme, aunque sea tan orgullosa».","Leyó hasta bien entrada la madrugada. Comprendió que el distanciamiento no había sido tan unilateral como siempre le habían contado. Por la mañana, un vecino llamado Sebastián se presentó con una oferta para comprar la finca, y le advirtió de que, si tardaba en decidir, el precio bajaría."]},{"h":"La cosecha","p":["Elena podría haber aceptado el dinero y regresar a su vida en Madrid, pero algo se lo impedía. Pidió que le enseñaran a podar, a recoger la aceituna con vara y red, a distinguir un aceite honesto de uno mediocre. Los jornaleros, desconfiados al principio, terminaron por respetarla.","Al llegar diciembre, el primer aceite de la cosecha, verde y espeso, llenó la cocina de un aroma que ella reconoció de inmediato. Rechazó la oferta de Sebastián, quien se encogió de hombros sin rencor. Antes de marcharse, Elena escribió en el cuaderno una sola línea: «Ya estoy aquí, tío»."]}],"gl":{"notario":"كاتب عدل","olivar":"بستان زيتون","enfadarse":"يغضب","finca":"مزرعة","colinas":"تلال","retorcidos":"ملتوية","deteriorada":"متهالكة","humedad":"رطوبة","aparador":"خزانة صحون","manteles":"مفارش الطاولة","cosecha":"موسم الحصاد","orgullosa":"متكبّرة","madrugada":"فجر","distanciamiento":"جفاء","podar":"يقلّم الأشجار","aceituna":"زيتونة","jornaleros":"عمّال المياومة","desconfiados":"متشكّكون","rencor":"ضغينة","advirtió":"حذّر"}},{"id":"t5","lv":"C1","t":"El afinador de Montevideo","au":"Notas Reader","d":"مولِّف بيانو يكتشف سرًّا في آلة قديمة ويواجه معضلة الحقيقة والوفاء.","ch":[{"h":"La nota discordante","p":["Ismael llevaba cuarenta años afinando pianos en Montevideo y creía que ya ningún instrumento podía sorprenderlo. Sin embargo, aquella tarde de otoño, en una casona de la Ciudad Vieja cuyos balcones se desmoronaban con elegancia, el viejo Pleyel de cola emitió una nota que no concordaba con ninguna otra: un sonido sordo, como si el piano guardara algo en el vientre.","Desatornilló la tapa con una paciencia casi ritual y, entre las cuerdas, halló un fajo de partituras atado con una cinta descolorida. La firma era la de la célebre Amalia Ferrer, pero la caligrafía de los márgenes, minuciosa y distinta, correspondía a otra mano, y una nota rezaba: «Esta música es de Clara. Que alguien lo sepa algún día»."]},{"h":"Una ficción deliberada","p":["La dueña de la casa, una anciana de mirada afilada llamada Inés, sobrina de la compositora, no se inmutó ante el hallazgo. «Clara era la hermana menor», explicó, «tímida hasta enfermar ante el público; Amalia, en cambio, brillaba en cualquier escenario. Pactaron que la una escribiera y la otra firmara. Nadie salió perjudicado, salvo la verdad».","—No le exijo que calle —añadió—, pero le ruego que reflexione antes de hablar. Si esto se supiera, el legado de mi familia quedaría hecho añicos, y los homenajes de la ciudad se tornarían en burla."]},{"h":"El precio de la honestidad","p":["Ismael volvió a casa dando vueltas al asunto. ¿Era la verdad un deber, o más bien un lujo que solo podían permitirse quienes no tenían nada que perder? Pensó en Clara, que había renunciado a su nombre para poder seguir creando, y se preguntó si desvelarla no sería una forma tardía de traicionarla.","Al cabo de varias semanas, tomó una decisión que no dejó satisfechos ni a los fanáticos de Amalia ni a los apóstoles de la franqueza. Devolvió las partituras a su escondite, pero entregó a la Biblioteca Nacional una carta anónima y un sobre sellado, con la instrucción de que no se abriera hasta que hubieran pasado cincuenta años. Quizá la verdad, pensó, también necesita esperar su momento."]}],"gl":{"afinando":"يضبط نغمة","casona":"دارة كبيرة","desmoronaban":"كانت تتداعى","cola":"ذيل (بيانو كبير)","sordo":"مكتوم","vientre":"بطن","desatornilló":"فكّ البراغي","cuerdas":"أوتار","fajo":"رزمة","descolorida":"باهتة","célebre":"مشهورة","caligrafía":"خطّ اليد","minuciosa":"دقيقة","hallazgo":"اكتشاف","inmutó":"اضطرب","pactaron":"اتّفقوا","perjudicado":"متضرّر","legado":"إرث","añicos":"شظايا","desvelarla":"كشف سرّها","traicionarla":"خيانتها","franqueza":"صراحة","escondite":"مخبأ","anónima":"مجهولة المصدر"}}];

var BK_APPB=[{"id":"a1","cat":"rom","t":"La librería del puerto","au":"Notas Library","d":"رواية قصيرة عن مكتبة قديمة في فالنسيا وملاحظات مجهولة بين صفحات الكتب.","ch":[{"h":"Capítulo 1: La puerta cerrada","p":["Marina abrió por primera vez la librería de su tía, en una callejuela cercana al puerto de Valencia. Olía a papel viejo y a sal. Las estanterías llegaban hasta el techo, y en el mostrador dormía un gato gordo que nadie le había presentado.","Mientras ordenaba los libros de poesía, encontró un papel doblado entre dos páginas. Decía: «Si lees esto, el libro ya es tuyo. Cuídalo». No tenía firma. Marina sonrió, sin saber por qué, y lo guardó en el bolsillo."]},{"h":"Capítulo 2: Las notas","p":["Durante las semanas siguientes, aparecieron más notas. Estaban en novelas, en diccionarios y hasta en un libro de cocina. Siempre eran frases breves, escritas con una letra elegante y azul. Marina empezó a esperar cada hallazgo como quien espera una carta.","Un día decidió responder. Escribió en un papel: «¿Quién eres?» y lo dejó dentro del mismo libro de poesía. Al día siguiente, el libro ya no estaba en su sitio. En su lugar había una rosa blanca y una dirección: «Café Llum, a las seis»."]},{"h":"Capítulo 3: El café","p":["A las seis menos cinco, Marina ya estaba en el café con el corazón acelerado. Pidió un té y miró la puerta cada vez que se abría. Entraron una pareja, dos turistas y un anciano con bastón. Nadie parecía buscar a nadie.","Entonces el anciano se acercó a su mesa y se sentó con una sonrisa. «Soy Rafael, el antiguo dueño de la librería», dijo. «Tu tía me pidió que te esperase. Las notas eran mías, pero hay alguien más que quiere conocerte». Detrás de él, un joven con un libro azul en la mano sonreía, nervioso."]}]},{"id":"a2","cat":"rom","t":"Cartas de ida y vuelta","au":"Notas Library","d":"رواية قصيرة عن مراسلة بين فتاة في ليما وشاب في مدريد بدأت بخطأ في عنوان بريد.","ch":[{"h":"Capítulo 1: El primer mensaje","p":["Valeria vivía en Lima y trabajaba en una agencia de viajes. Una noche, por error, envió una receta de ceviche a un correo equivocado. Quería mandársela a su prima Lucía, pero escribió mal una letra de la dirección.","La respuesta llegó a la mañana siguiente: «Gracias, pero soy vegetariano. Aun así, la foto es preciosa. Diego, Madrid». Valeria se rio sola frente al ordenador y contestó: «Perdón. Si quieres, te mando una receta sin pescado»."]},{"h":"Capítulo 2: Un océano de por medio","p":["Poco a poco, los mensajes se hicieron largos. Hablaban de música, de sus familias y de las comidas de sus ciudades. Diego escribía por la mañana, cuando en Lima aún era de madrugada, y Valeria le contestaba al despertarse, con el café en la mano.","Un día Diego escribió: «Tengo vacaciones en abril. ¿Te parece mal si visito Lima?». Valeria tardó una hora en responder, no por duda, sino porque no encontraba las palabras. Al final puso solo: «Ven. Yo te enseño el mejor ceviche, con pescado»."]},{"h":"Capítulo 3: El aeropuerto","p":["Valeria llegó al aeropuerto con un cartel que decía «Diego, el vegetariano». Estaba nerviosa y llevaba flores en la mano. Las puertas se abrieron muchas veces, y por fin apareció un chico alto con una mochila y una sonrisa enorme.","—¡Eres igual que en la foto! —dijo él. —Y tú, más alto que en mis sueños —respondió ella. Se rieron. Después de tantas cartas, no tuvieron que presentarse: ya se conocían. Salieron juntos al aire fresco de Lima, y la historia, esta vez, la escribieron a dos manos."]}]},{"id":"a3","cat":"short","t":"El vecino del tercero","au":"Notas Library","d":"قصة قصيرة عن جارٍ صارم يخفي موسيقى حزينة وطفلة تصغي إليها.","ch":[{"h":"Parte 1","p":["En el edificio de la calle Aribau, todos conocían al señor Anselmo, el vecino del tercero. Era serio, llevaba siempre una gabardina gris y casi nunca saludaba. Los niños decían que no sabía sonreír. Julia, que tenía nueve años, no estaba tan segura.","Un sábado, Julia oyó una música suave que venía del tercer piso. Era un violín. Se quedó en la escalera, sin respirar, escuchando una melodía triste y bonita. Cuando terminó, la puerta se abrió y apareció el señor Anselmo."]},{"h":"Parte 2","p":["—¿Te ha gustado? —preguntó él, con voz ronca. Julia asintió. Entonces el hombre contó que tocaba para su esposa, que ya no vivía, y que esa canción era la favorita de ella. Hacía años que no tocaba delante de nadie.","Desde ese día, cada sábado Julia se sentaba en la escalera, y poco a poco se sumaron otros vecinos. El edificio entero escuchaba en silencio. El señor Anselmo seguía con su gabardina gris, pero ahora, de vez en cuando, saludaba... y hasta sonreía."]}]},{"id":"a4","cat":"short","t":"Chocolate a las cinco","au":"Notas Library","d":"لحظة هادئة في مطبخ بوغوتا تحوّل يومًا سيئًا إلى مساء دافئ.","ch":[{"h":"Parte 1","p":["Eran las cinco de la tarde y llovía en Bogotá. Daniela volvió del trabajo con los zapatos mojados y un día muy malo en la espalda. Había perdido un cliente, había discutido con su jefe y había olvidado el paraguas. No quería hablar con nadie.","En la cocina, su abuela estaba de pie junto a la estufa. No preguntó nada. Solo sacó dos tazas, partió una tableta de chocolate y la puso en la leche caliente. El olor a canela llenó la casa."]},{"h":"Parte 2","p":["Se sentaron a la mesa. Durante un rato solo se oyó la lluvia y el sonido de la cuchara. Daniela bebió un sorbo largo y sintió que el cuerpo, poco a poco, dejaba de estar tan tenso.","—Mañana será otro día —dijo la abuela por fin, y eso fue todo. No hubo consejos ni discursos. Pero cuando Daniela se levantó de la mesa, el mundo era un poco más pequeño, un poco más cálido y, sobre todo, mucho menos difícil."]}]},{"id":"a5","cat":"short","t":"La flauta del afilador","au":"Notas Library","d":"قصة قصيرة عن سنّان سكاكين في بلدة إسبانية يعلّم طفلًا معنى الألفة.","ch":[{"h":"Parte 1","p":["En el pueblo de Ronda todavía pasaba el afilador. Se anunciaba con una pequeña flauta de siete notas que subía y bajaba por las calles empedradas. Los mayores salían con sus cuchillos y tijeras; los niños salían solo para mirar.","Pablo, que tenía ocho años, lo seguía cada martes. Un día se atrevió a preguntar: «¿Por qué tocas siempre la misma canción?». El afilador sonrió y respondió: «Porque así sabéis que soy yo, aunque no me veáis»."]},{"h":"Parte 2","p":["Esa frase se quedó dando vueltas en la cabeza de Pablo. Pensó en su padre, que trabajaba lejos y llamaba cada noche a la misma hora. Pensó en el reloj de la iglesia, en el canto del gallo, en todas las cosas que avisan sin hablar.","El martes siguiente, Pablo llevó una flauta de plástico y tocó, mal pero con orgullo, la canción del afilador. El hombre rio, afiló un cuchillo y le dijo: «Ahora ya sabes lo más importante: lo que se repite con cariño se convierte en hogar»."]}]},{"id":"a6","cat":"lang","t":"Diez frases cotidianas","au":"Notas Library","d":"عبارات إسبانية شائعة مع شرح استعمالها والفروق بين إسبانيا وأمريكا اللاتينية.","ch":[{"h":"Saludos y agradecimientos","p":["1. «¿Qué tal?» sirve para saludar y preguntar cómo está alguien; la respuesta habitual es «Bien, ¿y tú?». 2. «Mucho gusto» o «Encantado/a» se usa al conocer a una persona. 3. «Buenos días» se dice hasta el mediodía, «buenas tardes» hasta el anochecer y «buenas noches» después. En México, entre amigos, se oye mucho «¿Qué onda?».","4. «Gracias» se contesta con «de nada» o «no hay de qué». 5. Para aceptar algo, en España se dice «vale» a todas horas; en América Latina es más común «de acuerdo», «listo» (Colombia) o «dale» (Argentina). 6. «Hasta luego» no significa que vayas a volver pronto: es una despedida normal."]},{"h":"Pedir ayuda","p":["7. «Perdone» o «disculpe» sirven para llamar la atención de un desconocido o para pedir paso. 8. «¿Me puede ayudar?» es educado con desconocidos; entre amigos basta «¿Me ayudas?». Aquí aparece la diferencia entre «tú» y «usted»: «usted» marca respeto y distancia. En España el «tú» se usa pronto, pero en Colombia el «usted» es frecuente incluso en la familia.","9. «No entiendo» y «¿Puede hablar más despacio?» son frases esenciales para quien aprende. 10. «¿Cómo se dice...?» permite preguntar una palabra nueva sin vergüenza. Recuerda: en Argentina y Uruguay se usa «vos» en lugar de «tú» («vos tenés»), y en casi toda América se dice «ustedes» en vez de «vosotros»."]}]},{"id":"a7","cat":"lang","t":"Errores comunes, explicados","au":"Notas Library","d":"أخطاء إسبانية شائعة يقع فيها المتعلّمون: ser/estar وpor/para والأصدقاء الزائفون والجنس والتشكيل.","ch":[{"h":"Palabras pequeñas, errores grandes","p":["Ser y estar. Usamos «ser» para la identidad y las características permanentes («Soy médico», «Es alto») y «estar» para estados y lugares («Estoy cansada», «Estamos en Sevilla»). A veces cambia el sentido: «Es aburrido» describe a una persona que aburre; «Está aburrido» significa que se aburre ahora.","Por y para. «Para» expresa finalidad o destino («Estudio para aprender», «Salgo para Madrid»); «por» expresa causa, medio o duración («Gracias por tu ayuda», «Hablamos por teléfono»). Cuidado con los falsos amigos: «embarazada» significa que esperas un bebé, no que sientes vergüenza (para eso, «avergonzada»), y «actualmente» significa «ahora», no «de hecho»."]},{"h":"Género y acentos","p":["El género. Muchas palabras terminadas en -a son femeninas y en -o masculinas, pero hay excepciones: «el día», «el mapa», «el problema», «la mano», «la foto». Con «agua» usamos «el agua» por el sonido, pero el adjetivo sigue siendo femenino: «el agua fría».","Los acentos. La tilde distingue palabras iguales: «tu» (posesivo) y «tú» (pronombre), «el» (artículo) y «él» (pronombre), «si» (condición) y «sí» (afirmación). Además, «qué», «cómo» y «dónde» llevan tilde en preguntas y exclamaciones. «Porque» responde; «por qué» pregunta."]}]}];

function bkVocab(rd,gl){
  var cnt={},orig={},sent={},total=bkWordCount(rd);
  rd.ch.forEach(function(c){c.p.forEach(function(p){
    var sn=p.match(/[^.!?]+[.!?]*/g)||[p];
    sn.forEach(function(s,si){
      (s.match(/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ']+/g)||[]).forEach(function(w,i){
        var lw=w.toLowerCase();
        if(/'/.test(lw))return;

        if(!inG){
          if(lw.length<5||STOP[lw]||BK_COMMON[lw])return;
          if(/^[A-ZÁÉÍÓÚÑ]/.test(w)&&(i>0||si>0))return;
        }
        var k=nz(lw);cnt[k]=(cnt[k]||0)+1;
        if(!orig[k])orig[k]=lw;

    });
  })});

    var w=orig[k],sc=(gl&&gl[w])?1000+w.length:((w.length>=9?4:w.length>=7?3:2)*10+Math.min(cnt[k],5));
    return {w:w,cnt:cnt[k],sc:sc,sent:sent[k]||''};
  }).sort(function(a,b){return b.sc-a.sc||b.w.length-a.w.length});
  if(gl)ks=ks.filter(function(x){return gl[x.w]});
  var cap=gl?Math.min(40,ks.length):Math.min(60,Math.max(15,Math.ceil(total/90)));
  var words=ks.slice(0,cap).map(function(x){return {w:x.w,ar:bkMeaning(x.w,gl),cnt:x.cnt,sent:x.sent}});
  return words;
}

function bkMakeExam(vc){
  var W=vc.words.filter(function(x){return x.ar}),N=bkExamN(vc.rd);
  var used={},pool={mean:[],rev:[],tf:[],spell:[],cloze:[]};
  function others(x,k,f){return bkShuf(W.filter(function(o){return o!==x&&bkShort(o.ar)!==bkShort(x.ar)})).slice(0,k).map(f)}
  bkShuf(W).forEach(function(x){
    if(W.length>=4){
      var o1=others(x,3,function(o){return bkShort(o.ar)});
      if(o1.length===3){var op=bkShuf(o1.concat([bkShort(x.ar)]));pool.mean.push({k:'mc',tag:'معنى كلمة',q:'ما معنى «'+x.w+'»؟',qltr:x.w,opts:op,a:op.indexOf(bkShort(x.ar)),w:x});}
      var o2=others(x,3,function(o){return o.w});
      if(o2.length===3){var op2=bkShuf(o2.concat([x.w]));pool.rev.push({k:'mc',tag:'من العربية إلى الإسبانية',q:'ما الكلمة الإسبانية التي معناها «'+bkShort(x.ar)+'»؟',opts:op2,ltr:true,a:op2.indexOf(x.w),w:x});}
    }
    if(W.length>=2){
      var tr=Math.random()<.5,oth=others(x,1,function(o){return bkShort(o.ar)})[0];
      if(tr||!oth)pool.tf.push({k:'tf',tag:'صح أم خطأ',q:'كلمة «'+x.w+'» تعني «'+bkShort(x.ar)+'»',a:true,w:x});
      else pool.tf.push({k:'tf',tag:'صح أم خطأ',q:'كلمة «'+x.w+'» تعني «'+oth+'»',a:false,w:x});
    }
    pool.spell.push({k:'sp',tag:'إملاء',q:'اكتب الكلمة الإسبانية الصحيحة لهذا المعنى: «'+bkShort(x.ar)+'»',ans:x.w,w:x});
  });
  var all=vc.words.filter(function(x){return x.sent});
  bkShuf(all).forEach(function(x){
    var re=new RegExp(ESB+x.w.replace(/[^a-záéíóúüñ]/gi,'')+ESA,'i');
    if(!re.test(x.sent))return;
    var suf=function(w){return w.slice(-2)},cand=bkShuf(vc.words.filter(function(o){return o!==x&&o.w!==x.w}));
    var d=cand.filter(function(o){return suf(o.w)===suf(x.w)}).concat(cand.filter(function(o){return suf(o.w)!==suf(x.w)&&Math.abs(o.w.length-x.w.length)<=3})).slice(0,3);
    if(d.length<3)d=bkShuf(vc.words.filter(function(o){return o!==x})).slice(0,3);
    if(d.length<3)return;
    var op=bkShuf(d.map(function(o){return o.w}).concat([x.w]));
    pool.cloze.push({k:'mc',tag:'أكمل الجملة',q:x.sent.replace(re,'_____'),ltr:true,qltr:true,opts:op,a:op.indexOf(x.w),w:x,tg:1});
  });
  var order=['mean','cloze','tf','spell','rev','cloze','mean','tf','rev','spell'],out=[],guard=0;
  while(out.length<N&&guard++<400){
    var any=false;
    for(var i=0;i<order.length&&out.length<N;i++){
      var p=pool[order[i]];
      while(p.length){
        var q=p.shift(),k=q.w.w;
        if((used[k]||0)>=2)continue;
        used[k]=(used[k]||0)+1;out.push(q);any=true;break;
      }
    }
    if(!any)break;
  }
  return out;
}

      if(out.replace(/\s/g,'').length<20){BK.busy='';BK.err='لم أجد نصًا واضحًا في الصور.';renderSheet();return}

  })();
}
function bkLinesToParas(lines){
  var mx=0,out=[],cur='';
  lines=lines.map(function(l){return l.replace(/\s+/g,' ').trim()}).filter(function(l){return l&&!/^\d{1,4}$/.test(l)});
  lines.forEach(function(l){mx=Math.max(mx,l.length)});
  lines.forEach(function(l){
    if(cur&&/-$/.test(cur)&&/^[a-záéíóúüñ]/.test(l))cur=cur.slice(0,-1)+l;else cur+=(cur?' ':'')+l;
    if(/[.!?:”"')\]]$/.test(l)&&l.length<mx*.85){out.push(cur);cur=''}
  });
  if(cur)out.push(cur);
  return out;
}
async function bkPdfBook(file,upd){
  if(!window.pdfjsLib){upd('تحميل قارئ PDF (مرة واحدة)...');await stLoad(LIB_PDF)}
  var lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=LIB_PDFW;
  var doc=await lib.getDocument({data:await file.arrayBuffer()}).promise,total=Math.min(doc.numPages,1500),pages=[],chars=0;
  for(var i=1;i<=total;i++){
    var pg=await doc.getPage(i),tc=await pg.getTextContent();
    var txt=tc.items.map(function(it){return it.str+(it.hasEOL?'\n':' ')}).join('');
    var ps=bkLinesToParas(txt.split('\n'));
    pages.push(ps);chars+=ps.join('').length;
    if(i%4===0||i===total){upd('قراءة صفحات PDF '+i+' من '+total+'...');await new Promise(function(r){setTimeout(r,0)})}
  }
  if(chars<80){
    if(navigator.onLine===false)throw new Error('scan');
    if(!window.Tesseract){upd('تحميل محرك قراءة الصور (مرة واحدة)...');await stLoad(LIB_TESS)}
    var n=Math.min(doc.numPages,40),idx=0;pages=[];
    var w=await Tesseract.createWorker('spa',1,{logger:function(m){if(m&&m.status==='recognizing text')upd('قراءة الصفحة '+(idx+1)+' من '+n+' بالتعرف الضوئي... '+Math.round(m.progress*100)+'%')}});
    try{
      for(idx=0;idx<n;idx++){
        var p2=await doc.getPage(idx+1),vp=p2.getViewport({scale:2}),c=document.createElement('canvas');
        c.width=vp.width;c.height=vp.height;await p2.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
        var r=await w.recognize(c);pages.push(bkParas(r&&r.data&&r.data.text||''));
      }
    }finally{try{await w.terminate()}catch(e){}}
  }
  var out=[],cur=[],len=0,from=1;
  pages.forEach(function(ps,i){
    ps.forEach(function(p){cur.push(p);len+=p.length});
    if(len>=3500){out.push({h:'Pages '+from+(i+1>from?'–'+(i+1):''),p:cur});cur=[];len=0;from=i+2}
  });
  if(cur.length)out.push({h:'Pages '+from+(pages.length>from?'–'+pages.length:''),p:cur});
  return out.filter(function(c){return c.p.length});
}
function bkSaveDraft(){
  var d=BK.draft;BK.err='';
  var id='bk'+Date.now().toString(36),typed=d.t.trim(),meta={id:id,t:typed||d.fn||'كتاب',au:d.au.trim(),d:d.d.trim(),cat:d.cat,at:Date.now(),fav:false,cur:0,ext:d.ext,src:d.src};
  if(d.cov)meta.cov=d.cov;
  var done=function(){BK.busy='';BK.draft=null;BK.ft='all';BK.q='';BK.key='b:'+id;BK.hs=[{view:'lhome',cat:null,key:null,sel:null},{view:'home',cat:null,key:null,sel:null},{view:'cmap',cat:meta.cat,key:null,sel:'b:'+id}];toast('تمت إضافة الكتاب');bkOpenRead('b:'+id,0)};
  var fail=function(m){BK.busy='';BK.err=m;d.file=null;d.text='';d.name='';renderSheet()};
  var store1=function(ch){meta.kind='text';meta.n=ch.length;return bkPut(id,{ch:ch}).then(function(){BKM.unshift(meta);bkSave();done()})};
  BK.busy='جارٍ تجهيز الكتاب...';renderSheet();
  if(d.text){var ch=bkFromText(d.text);if(!ch.length)return fail('النص فارغ.');return store1(ch).catch(function(){fail('تعذّر حفظ الكتاب على هذا الجهاز.')})}
  var f=d.file,ext=(f.name.split('.').pop()||'').toLowerCase();
  if(ext==='pdf'){
    if(f.size>60*1048576)return fail('الملف كبير جداً (الحد 60MB).');
    var upd=function(m){BK.busy=m;var e=$('#bkBusy');if(e)e.textContent=m};
    bkPdfBook(f,upd).then(function(ch){if(!ch.length)return fail('لم أجد نصاً في ملف PDF.');return store1(ch)}).catch(function(e){fail(e&&e.message==='scan'?'الملف عبارة عن صور ويحتاج إنترنت لقراءته.':'تعذّرت قراءة ملف PDF. تأكد من الإنترنت وجرّب مرة ثانية.')});
  }
  else if(ext==='txt'){
    if(f.size>6*1048576)return fail('الملف كبير جداً (الحد 6MB).');
    f.text().then(function(t){var ch=bkFromText(t);if(!ch.length)return fail('الملف فارغ.');return store1(ch)}).catch(function(){fail('تعذّر حفظ الكتاب على هذا الجهاز.')});
  }else if(ext==='epub'){
    if(f.size>40*1048576)return fail('الملف كبير جداً (الحد 40MB).');
    f.arrayBuffer().then(bkFromEpub).then(function(info){
      if(!info.ch.length)return fail('لم أجد نصاً قابلاً للقراءة في هذا الملف.');
      if(info.au&&!meta.au)meta.au=info.au;if(info.t&&!typed)meta.t=info.t;
      return store1(info.ch);
    }).catch(function(e){fail(e&&e.message==='nods'?'متصفحك لا يدعم قراءة EPUB. جرّب Chrome أو استخدم ملف TXT.':'تعذّرت قراءة ملف EPUB. جرّب ملفاً آخر.')});
  }else fail('الصيغة غير مدعومة.');
}

var AC=null;
function soundOn(){return pref.sound!==false}
function tone(f,t0,d,g,type,f2){
  var o=AC.createOscillator(),a=AC.createGain(),n=AC.currentTime+t0;
  o.type=type||'triangle';o.frequency.setValueAtTime(f,n);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);
  a.gain.setValueAtTime(0.0001,n);a.gain.exponentialRampToValueAtTime(g,n+.015);a.gain.exponentialRampToValueAtTime(0.0001,n+d);
  o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d+.05);
}
function chime(k){
  if(!soundOn())return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    if(k==='good'){tone(659.25,0,.13,.12);tone(987.77,.09,.22,.12)}
    else if(k==='bad'){tone(349.23,0,.15,.26,'triangle');tone(261.63,.14,.15,.26,'triangle');tone(196,.28,.34,.26,'triangle')}
    else if(k==='end'){
      [392,523.25,659.25,783.99].forEach(function(f,i){tone(f,i*.12,.26,.11)});
      [523.25,659.25,783.99,1046.5].forEach(function(f){tone(f,.52,.9,.06,'sine')});
    }
  }catch(e){}
}

var wod=store.get('wbs.wod',null);
var WOD_MS=6*3600000;
function pickWod(){
  var today=dk(Date.now());
  if(wod&&wod.at&&Date.now()-wod.at<WOD_MS&&items.some(function(i){return i.id===wod.id}))return;
  var pool=items.filter(function(i){return !i.ex});
  if(!pool.length)pool=items.slice();
  if(!pool.length){wod=null;return}
  pool=pool.slice().sort(function(a,b){return (a.sn||a.ts)-(b.sn||b.ts)}).slice(0,5);
  var it=pool[Math.floor(Math.random()*pool.length)];
  wod={day:today,at:Date.now(),id:it.id,was:Math.floor((Date.now()-(it.sn||it.ts))/DAY)};
  store.set('wbs.wod',wod);
  review(it);
}

var EN_RULES=[
  [/قبل (يوم|يومان|\d+ أيام|\d+ يومًا)/g,function(m,a){return a+' ago'}],
  [/لديك (\d+) (?:كلمة|كلمات) مرّ عليها (\d+) أيام أو أكثر دون مراجعة أو اختبار\. هل تود مراجعتها الآن؟/g,function(m,n,d){return 'You have '+n+' '+(n==1?'word':'words')+' that haven’t been reviewed or quizzed for '+d+' days or more. Review them now?'}]
];
var EN_KEYS=Object.keys(EN_DICT).sort(function(a,b){return b.length-a.length});
var EN_RE=new RegExp(EN_KEYS.map(function(k){return k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}).join('|'),'g');
var AR_ANY=/[؀-ۿ]/;
function trStr(str){
  EN_RULES.forEach(function(r){str=str.replace(r[0],r[1])});
  return str.replace(EN_RE,function(m,off,all){
    var b=all.charAt(off-1),a=all.charAt(off+m.length);
    if(AR_ANY.test(b)||AR_ANY.test(a))return m;
    return EN_DICT[m];
  });
}
var NO_TR='.en,.ar,.d-word,.val:not(.none),.trw,.q-word,.opt,.fc-word,.fnode,.g-en,.note,.sw,[data-nt],textarea,script,style';
var orig=new WeakMap(),TR_ATTR=['placeholder','aria-label','title'];
function trText(n){
  var p=n.parentNode;if(!p||p.nodeType!==1)return;
  var v=n.nodeValue;if(!AR_ANY.test(v))return;
  if(p.closest&&p.closest(NO_TR))return;
  var t=trStr(v);if(t!==v){orig.set(n,v);n.nodeValue=t}
}
function trAttr(el,a){
  var v=el.getAttribute(a);if(!v||!AR_ANY.test(v))return;
  if(el.closest&&el.closest('[data-nt]'))return;
  var t=trStr(v);if(t!==v){el.__ao=el.__ao||{};el.__ao[a]=v;el.setAttribute(a,t)}
}
function trTree(root){
  if(root.nodeType===3){trText(root);return}
  if(root.nodeType!==1)return;
  TR_ATTR.forEach(function(a){if(root.hasAttribute(a))trAttr(root,a)});
  $$('[placeholder],[aria-label],[title]',root).forEach(function(el){TR_ATTR.forEach(function(a){if(el.hasAttribute(a))trAttr(el,a)})});
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),n,list=[];
  while((n=w.nextNode()))list.push(n);
  list.forEach(trText);
}
function restoreTree(root){
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),n;
  while((n=w.nextNode())){var o=orig.get(n);if(o!==undefined){n.nodeValue=o;orig.delete(n)}}
  $$('*',root).forEach(function(el){if(el.__ao){Object.keys(el.__ao).forEach(function(a){el.setAttribute(a,el.__ao[a])});el.__ao=null}});
}
var trObs=null,appEl=$('#app');
function obsStart(){
  if(trObs)return;
  trObs=new MutationObserver(function(ms){
    ms.forEach(function(m){
      if(m.type==='childList')m.addedNodes.forEach(trTree);
      else if(m.type==='characterData')trText(m.target);
      else if(m.type==='attributes')trAttr(m.target,m.attributeName);
    });
    trObs.takeRecords();
  });
  trObs.observe(appEl,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:TR_ATTR});
}
function obsStop(){if(trObs){trObs.disconnect();trObs=null}}
function applyDir(){appEl.setAttribute('dir',LANG==='en'?'ltr':'rtl');root.lang=LANG}
function setLang(v){
  v=v==='en'?'en':'ar';if(v===LANG)return;

}

  var n=Date.now();
  return items.filter(function(i){return dueAt(i)<=n}).map(function(i){return {i:i,k:dueAt(i)+Math.random()}}).sort(function(a,b){return a.k-b.k}).map(function(x){return x.i});
}
function nextDueText(){

function related(a,b){
  a=a.toLowerCase();b=b.toLowerCase();if(a===b)return false;
  var sh=a.length<=b.length?a:b,lo=sh===a?b:a;
  if(sh.length>=3&&lo.indexOf(sh)===0&&lo.length-sh.length>=2)return true;
  var cp=0;while(cp<sh.length&&sh.charAt(cp)===lo.charAt(cp))cp++;
  return cp>=5&&cp>=sh.length-3;
}
function famGroups(){
  var ws=items.filter(function(i){return i.type==='word'&&isSingle(i.en)});
  var par={};ws.forEach(function(w){par[w.id]=w.id});
  function f(x){while(par[x]!==x){par[x]=par[par[x]];x=par[x]}return x}
  for(var i=0;i<ws.length;i++)for(var j=i+1;j<ws.length;j++)if(related(ws[i].en,ws[j].en))par[f(ws[i].id)]=f(ws[j].id);
  var g={};ws.forEach(function(w){var r=f(w.id);(g[r]=g[r]||[]).push(w)});
  return {groups:Object.keys(g).map(function(k){return g[k]}).filter(function(a){return a.length>1}).map(function(a){return a.sort(function(x,y){return x.en.length-y.en.length||x.ts-y.ts})}),total:ws.length};
}

}
function famSvg(arr){

      '<rect x="'+(-w/2)+'" y="-13" width="'+w+'" height="26" rx="13"/>'+

    fetch('https://api.languagetool.org/v2/check',o).then(function(r){return r.ok?r.json():null}).then(function(j){
      if(done)return;done=true;clearTimeout(tm);
      if(!j||!Array.isArray(j.matches)){res(null);return}
      var iss=j.matches.filter(function(m){var t=(m.rule&&m.rule.issueType)||'';return t!=='typographical'&&t!=='style'&&t!=='whitespace'}).slice(0,4).map(function(m){

function goTo(id){
  var it=items.filter(function(x){return x.id===id})[0];if(!it)return;
  closeSheet();showPage('notes');
  if(bar.classList.contains('searching'))closeSearch();
  setTab(it.type==='word'?'words':'idioms');
  var li=$('.item[data-id="'+id+'"]');
  if(li){toggleItem(li,true);setTimeout(function(){li.scrollIntoView({block:'center',behavior:'smooth'})},120)}
}

function qItems(){return items.filter(function(i){return i.ar})}
function startQuiz(pool){
  quiz={pool:pool||shuffle(qItems()).slice(0,12),i:0,score:0,opts:[],picked:null};
  if(quiz.pool.length)prepQ();
}
function prepQ(){
  var q=quiz.pool[quiz.i];
  var others=shuffle(qItems().filter(function(x){return x.id!==q.id&&x.ar!==q.ar}).map(function(x){return x.ar}));
  var uniq=others.filter(function(v,i,a){return a.indexOf(v)===i}).slice(0,3);
  quiz.opts=shuffle([q.ar].concat(uniq));quiz.picked=null;
}

function backupJSON(){
  return JSON.stringify({app:'daily-words',version:1,exportedAt:new Date().toISOString(),items:items.filter(function(i){return !i.ex})},null,1);
}
function importData(text){
  var d;try{d=JSON.parse(text)}catch(e){toast('الملف غير صالح');return}
  var list=Array.isArray(d)?d:(d&&Array.isArray(d.items)?d.items:null);
  if(!list){toast('لم أجد كلمات في هذا الملف');return}
  var seen={};items.forEach(function(i){seen[i.type+'|'+i.en.toLowerCase()]=1});
  var used={};items.forEach(function(i){used[i.id]=1});
  var added=0;
  list.forEach(function(o,k){
    if(!o||typeof o.en!=='string'||!o.en.trim())return;
    var type=o.type==='idiom'?'idiom':'word',dk=type+'|'+o.en.trim().toLowerCase();
    if(seen[dk])return;
    seen[dk]=1;
    var id=(typeof o.id==='string'&&/^[\w-]{1,40}$/.test(o.id)&&!used[o.id])?o.id:'i'+Date.now().toString(36)+k;
    used[id]=1;
    items.push({id:id,en:o.en.trim(),ar:typeof o.ar==='string'?o.ar:'',cat:typeof o.cat==='string'&&o.cat?o.cat:'عام',notes:typeof o.notes==='string'?o.notes:'',ph:typeof o.ph==='string'?o.ph:'',type:type,ts:typeof o.ts==='number'?o.ts:Date.now(),upd:Date.now(),ex:false});
    dirty[id]=1;added++;
  });
  if(added){persist();render();syncSoon()}
  toast(added?'تم استرجاع '+added+' من الكلمات':'جميع كلمات النسخة موجودة لديك مسبقًا');
  if(current==='backup')renderSheet();
}

}

var cloud={user:store.get('wbs.drive',null),status:'out',token:'',exp:0,tc:null,ready:false,asking:false,fileId:'',syncing:false,again:false,pushed:0,pulled:0,at:0,err:'',needAuth:false,askedAt:0};
cloud.status=cloud.user?'in':'out';
var syncT;
function loadScript(src){return new Promise(function(res,rej){var el=document.createElement('script');el.src=src;el.async=true;el.onload=res;el.onerror=function(){rej(new Error('load'))};document.head.appendChild(el)})}
function refreshAccount(){if(current==='account'||(page==='profile'&&!current))renderSheet()}
function tokenValid(){return !!cloud.token&&Date.now()<cloud.exp}
function initCloud(){
  if(cloud.user)cloud.needAuth=true;
  loadScript('https://accounts.google.com/gsi/client').then(function(){
    cloud.tc=google.accounts.oauth2.initTokenClient({client_id:GCLIENT,scope:GSCOPE,callback:onToken,error_callback:onTokErr});
    cloud.ready=true;refreshAccount();
  }).catch(function(){cloud.err='تعذّر الاتصال بخدمة Google. تحقق من الإنترنت.';refreshAccount()});
}
/* يُستدعى من ضغطة المستخدم فقط حتى لا يمنع المتصفح النافذة */
function requestToken(first){
  if(!cloud.ready||!cloud.tc){cloud.err='خدمة Google لم تُحمَّل بعد، تحقق من الإنترنت وحاول مرة ثانية.';refreshAccount();return}
  if(!navigator.onLine){cloud.err='لا يوجد إنترنت الآن. كلماتك محفوظة على الجهاز وتُزامن لاحقًا.';refreshAccount();toast('لا يوجد إنترنت');return}
  if(cloud.asking)return;
  cloud.asking=true;cloud.askedAt=Date.now();cloud.err='';
  var o={prompt:first?'select_account':''};
  if(!first&&cloud.user&&cloud.user.email)o.login_hint=cloud.user.email;
  try{cloud.tc.requestAccessToken(o)}catch(e){cloud.asking=false;cloud.err='تعذّر فتح نافذة تسجيل الدخول.';refreshAccount()}
}
function onTokErr(e){
  cloud.asking=false;
  var t=e&&e.type;
  if(t==='popup_closed')return;
  cloud.err=t==='popup_failed_to_open'?'المتصفح منع نافذة تسجيل الدخول. اسمح بالنوافذ المنبثقة لهذا الموقع ثم أعد المحاولة.':'تعذّر تسجيل الدخول ('+(t||'خطأ')+').';
  refreshAccount();
}
function onToken(r){
  cloud.asking=false;
  if(!r||r.error){
    cloud.err=(r&&r.error==='access_denied')?'لم تتم الموافقة على الصلاحية.':'تعذّر تسجيل الدخول ('+((r&&r.error)||'خطأ')+').';
    refreshAccount();return;
  }
  if(!google.accounts.oauth2.hasGrantedAllScopes(r,GDRIVE)){
    cloud.err='يجب الموافقة على صلاحية Google Drive حتى تُحفظ كلماتك. أعد المحاولة وفعّل كل الخيارات.';
    refreshAccount();return;
  }
  var tok=r.access_token,exp=Date.now()+Math.max(60,(r.expires_in||3600)-120)*1000;
  fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+tok}}).then(function(x){
    if(!x.ok)throw new Error('userinfo');return x.json();
  }).then(function(u){
    if(cloud.user&&cloud.user.sub&&u.sub&&cloud.user.sub!==u.sub){
      cloud.err='اخترت حسابًا مختلفًا عن الحساب المربوط ('+(cloud.user.email||'')+'). سجّل الخروج أولًا إذا تريد تبديل الحساب.';
      refreshAccount();return;
    }
    cloud.user={sub:u.sub,email:u.email||'',name:u.name||''};store.set('wbs.drive',cloud.user);
    cloud.token=tok;cloud.exp=exp;cloud.needAuth=false;cloud.status='in';cloud.err='';
    refreshAccount();syncNow();
  }).catch(function(){cloud.err='تعذّر قراءة معلومات الحساب. تحقق من الإنترنت.';refreshAccount()});
}
function signIn(){cloud.err='';requestToken(true)}
function applyRemote(id,c){
  var l=items.filter(function(x){return x.id===id})[0];
  var known=!!l||tombs[id]!==undefined;
  var lu=l?(l.upd||l.ts||0):(tombs[id]||0),cu=c.upd||0;
  if(known&&cu<=lu)return false;
  delete dirty[id];
  if(c.deleted){if(l)items=items.filter(function(x){return x.id!==id});tombs[id]=cu;return true}
  var n={id:id,en:c.en||'',ar:c.ar||'',ph:c.ph||'',cat:c.cat||'عام',notes:c.notes||'',type:c.type==='idiom'?'idiom':'word',ts:c.ts||cu,upd:cu,lv:c.lv||0,sn:c.sn||0,ex:false};
  if(l)items[items.indexOf(l)]=n;else items.push(n);
  delete tombs[id];
  return true;
}
function dedupeKeys(){
  var by={},drop=[];
  items.forEach(function(i){
    if(i.ex)return;
    var k=i.type+'|'+i.en.toLowerCase(),o=by[k];
    if(!o){by[k]=i;return}
    var keepO=(o.upd||o.ts||0)>=(i.upd||i.ts||0);
    by[k]=keepO?o:i;drop.push(keepO?i:o);
  });
  if(!drop.length)return false;
  var gone={};drop.forEach(function(d){gone[d.id]=1;tombs[d.id]=Date.now();dirty[d.id]=1});
  items=items.filter(function(i){return !gone[i.id]});
  return true;
}

function gfetch(url,o,txt){
  o=o||{};
  var ctrl=typeof AbortController!=='undefined'?new AbortController():null;
  var timer=setTimeout(function(){if(ctrl)ctrl.abort()},25000);
  o.headers=Object.assign({Authorization:'Bearer '+cloud.token},o.headers||{});
  if(ctrl)o.signal=ctrl.signal;
  return fetch(url,o).then(function(res){
    clearTimeout(timer);
    if(res.ok)return txt?res.text():res.json();
    return res.json().catch(function(){return {}}).then(function(j){
      var er=(j&&j.error)||{},rs=(er.errors&&er.errors[0]&&er.errors[0].reason)||'';
      if(res.status===401){cloud.token='';cloud.needAuth=true}
      throw {code:res.status===401?'needauth':(rs||('http-'+res.status)),status:res.status,message:er.message||''};
    });
  },function(e){
    clearTimeout(timer);
    throw {code:(e&&e.name==='AbortError')?'timeout':'network',message:String((e&&e.message)||e)};
  });
}
function findFile(){
  if(cloud.fileId)return Promise.resolve(cloud.fileId);
  return gfetch(DAPI+'?spaces=appDataFolder&pageSize=10&orderBy=createdTime&fields='+encodeURIComponent('files(id,name,createdTime)')+'&q='+encodeURIComponent("name='palabras.json' and trashed=false")).then(function(r){
    var f=(r.files||[])[0];cloud.fileId=f?f.id:'';return cloud.fileId;
  });
}
function readRemote(){
  return findFile().then(function(id){
    if(!id)return {v:1,words:{}};
    return gfetch(DAPI+'/'+id+'?alt=media',{},true).then(function(t){
      var d=null;try{d=JSON.parse(t)}catch(e){}
      if(!d||typeof d!=='object'){if(!t||!t.trim())return {v:1,words:{}};throw {code:'badfile',message:''}}
      if(!d.words||typeof d.words!=='object')d.words={};
      return d;
    },function(e){if(e&&e.status===404){cloud.fileId='';return {v:1,words:{}}}throw e});
  });
}
function writeRemote(doc,retry){
  var body=JSON.stringify(doc);
  if(cloud.fileId){
    return gfetch(DUP+'/'+cloud.fileId+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:body}).catch(function(e){
      if(e&&e.status===404&&!retry){cloud.fileId='';return writeRemote(doc,true)}
      throw e;
    });
  }
  var bd='wbnd'+Date.now();
  var mp='--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:'palabras.json',parents:['appDataFolder']})+'\r\n--'+bd+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+bd+'--';
  return gfetch(DUP+'?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:mp}).then(function(r){cloud.fileId=r.id});
}
function entryFor(id){
  var it=items.filter(function(x){return x.id===id})[0];
  if(it){
    if(it.ex)return null;
    var u=it.upd||it.ts||0;
    return {upd:u,data:{en:it.en,ar:it.ar||'',ph:it.ph||'',cat:it.cat||'عام',notes:it.notes||'',type:it.type,ts:it.ts||u,upd:u,lv:it.lv||0,sn:it.sn||0,deleted:false}};
  }
  if(tombs[id]!==undefined)return {upd:tombs[id],data:{deleted:true,upd:tombs[id]}};
  return null;
}
function syncSoon(){clearTimeout(syncT);syncT=setTimeout(syncNow,1500)}
function syncErr(e){
  var c=(e&&e.code)||'';
  if(c==='accessNotConfigured'||c==='SERVICE_DISABLED')return 'واجهة Google Drive API غير مفعّلة في مشروع Google Cloud. فعّلها (Enable) ثم أعد المحاولة.';
  if(c==='insufficientPermissions'||c==='forbidden'||c==='http-403')return 'لا توجد صلاحية للوصول إلى الـDrive. سجّل الخروج ثم ادخل من جديد ووافق على كل الصلاحيات.';
  if(c==='network'||c==='timeout')return 'تعذّر الوصول إلى Google Drive ('+c+'). تحقق من الإنترنت.';
  if(c==='badfile')return 'ملف الكلمات في الـDrive غير مقروء. لم يُغيَّر شيء، وكلماتك المحلية سليمة.';
  return 'تعذّرت المزامنة ('+(c||String((e&&e.message)||e).slice(0,60))+').';
}
function syncNow(){
  if(!cloud.user||!navigator.onLine)return Promise.resolve();
  if(!tokenValid()){cloud.needAuth=true;refreshAccount();return Promise.resolve()}
  if(cloud.syncing){cloud.again=true;return Promise.resolve()}
  cloud.syncing=true;cloud.err='';refreshAccount();
  var pulled=0,pushed=0;
  return readRemote().then(function(doc){
    var w=doc.words,changed=false;
    Object.keys(w).forEach(function(id){if(applyRemote(id,w[id])){changed=true;pulled++}});
    if(dedupeKeys())changed=true;
    if(changed&&items.some(function(i){return i.ex})&&items.some(function(i){return !i.ex}))items=items.filter(function(i){return !i.ex});
    /* أي كلمة محلية ليست في الملف تُرفع أيضًا، حتى لو لم تُعلَّم قبل ذلك */
    items.forEach(function(i){if(!i.ex&&!w[i.id])dirty[i.id]=1});
    Object.keys(tombs).forEach(function(id){if(!w[id])dirty[id]=1});
    if(changed){persist();render()}
    var snap={},out=0;
    Object.keys(dirty).forEach(function(id){
      var e=entryFor(id);
      if(!e){delete dirty[id];return}
      var r=w[id];
      if(r&&(r.upd||0)>=e.upd){delete dirty[id];return}
      w[id]=e.data;snap[id]=e.upd;out++;
    });
    if(!out){persist();return 0}
    doc.v=1;doc.words=w;
    return writeRemote(doc).then(function(){
      Object.keys(snap).forEach(function(id){
        var cur=entryFor(id);
        if(cur&&cur.upd===snap[id])delete dirty[id];
      });
      persist();return out;
    });
  }).then(function(n){
    pushed=n||0;cloud.at=Date.now();cloud.pushed=pushed;cloud.pulled=pulled;persist();
  }).catch(function(e){
    if(e&&e.code==='needauth'){cloud.needAuth=true}else cloud.err=syncErr(e);
  }).then(function(){
    cloud.syncing=false;refreshAccount();
    if(cloud.again){cloud.again=false;syncSoon()}
  });
}
function doSignOut(){
  if(!tokenValid()&&Object.keys(dirty).length){toast('اضغط «إعادة الاتصال» أولًا حتى تُرفع تغييراتك ثم سجّل الخروج');return Promise.resolve()}
  return syncNow().then(function(){
    if(Object.keys(dirty).length){toast('هناك تغييرات لم تُرفع بعد، اتصل بالإنترنت ثم أعد المحاولة');return}
    try{if(cloud.token&&window.google)google.accounts.oauth2.revoke(cloud.token,function(){})}catch(e){}
    cloud.user=null;cloud.token='';cloud.exp=0;cloud.fileId='';cloud.status='out';cloud.needAuth=false;cloud.at=0;
    store.set('wbs.drive',null);
    items=seedItems();tombs={};dirty={};persist();render();toast('تم تسجيل الخروج');refreshAccount();
  });
}
function accountView(){
  var err=cloud.err?'<div class="hint err">'+esc(cloud.err)+'</div>':'';
  if(cloud.status==='out')return '<div class="group"><div class="exnote" style="line-height:1.8">سجّل الدخول بحساب Google لتُحفظ كلماتك تلقائيًا في Google Drive الخاص بك، داخل مجلد مخفي خاص بالتطبيق لا يظهر بين ملفاتك ولا يراه أحد غيرك. تبقى كلماتك بعد تحديث الموقع، وعند فتح التطبيق من جهاز آخر بنفس الحساب، وحتى لو حذفت التطبيق ثم ثبّته من جديد. الكلمات الموجودة على هذا الجهاز تُرفع إلى حسابك ولا تُحذف. التطبيق يعمل بدون إنترنت ويزامن عند رجوعه.</div></div>'+err+
    '<button class="btn-main gbtn" data-act="signin">'+G_LOGO+'تسجيل الدخول بحساب Google</button>';
  var u=cloud.user,pend=Object.keys(dirty).length,ok=tokenValid();
  var st=cloud.syncing?'جارٍ المزامنة...':(cloud.at?'آخر مزامنة: '+new Date(cloud.at).toLocaleTimeString(LANG==='en'?'en-GB':'ar-u-nu-latn',{hour:'2-digit',minute:'2-digit'})+' · رُفع '+cloud.pushed+' · وصل '+cloud.pulled:'لم تتم مزامنة بعد')+(pend?' · بانتظار الرفع: '+pend:'');
  var warn=(!ok&&!cloud.syncing)?'<div class="hint">التطبيق يعمل بشكل طبيعي وكلماتك محفوظة على الجهاز. اضغط «إعادة الاتصال» عندما يتوفر لديك إنترنت لتكمل المزامنة مع الـDrive.</div>':'';
  return '<div class="group"><div style="font-weight:800;overflow-wrap:anywhere">'+esc(u.name||'حسابك')+'</div><div class="exnote" dir="ltr" style="text-align:start;overflow-wrap:anywhere">'+esc(u.email||'')+'</div></div>'+
    '<div class="group"><div class="exnote">'+st+'</div></div>'+warn+err+
    '<div class="seg"><button class="sbtn" data-act="syncnow">'+(ok?'مزامنة الآن':'إعادة الاتصال')+'</button><button class="sbtn" data-act="signout">تسجيل الخروج</button></div>'+
    '<div class="exnote">عند تسجيل الخروج تُحذف الكلمات من هذا الجهاز فقط وتبقى محفوظة في Google Drive الخاص بك.</div>';
}
var FC_N=10;
function newFc(){
  var n=Date.now();
  var order=items.map(function(i){
    var lv=Math.max(0,Math.min(5,i.lv||0)),late=i.sn?Math.max(0,Math.min(10,(n-dueAt(i))/DAY)):3;
    var w=0.4+(5-lv)+late*0.35;
    return {id:i.id,k:Math.pow(Math.random(),1/w)};
  }).sort(function(a,b){return b.k-a.k}).slice(0,FC_N).map(function(x){return x.id});
  return {order:order,i:0,flipped:false,dict:!!pref.fcdict,res:null,okc:0,tried:0}}
function dnorm(x){return esLen(x).replace(/[\u2019\u2018]/g,"'").replace(/\s+/g,' ').replace(/[.!?,;]+$/,'').trim()}
function fcItem(){return items.filter(function(x){return x.id===fc.order[fc.i]})[0]}
function cardsView(){
  if(!fc.order.length)return testTabs()+'<div class="empty">أضف كلمات لتظهر بطاقات المراجعة هنا.</div>';
  var modes=testTabs();
  return modes+'<div class="fc-meta"><span id="fcCount"></span><button class="pbtn" data-act="fcshuffle">خلط البطاقات</button></div>'+
    '<div class="q-prog"><i id="fcProg"></i></div>'+
    '<div class="fc-scene" id="fcScene"><div class="fc-card" id="fcCard" data-act="fcflip" role="button" tabindex="0" aria-label="اضغط لقلب البطاقة">'+
      '<div class="fc-face fc-front"><button class="ibtn fc-snd" data-act="fcsay" aria-label="نطق الكلمة">'+SPK+'</button><div class="fc-c"><div class="fc-word" id="fcWord"></div><div class="fc-tip" id="fcTip">اضغط على البطاقة لقلبها</div></div></div>'+
      '<div class="fc-face fc-back"><div class="fc-c"><div class="fc-sm" id="fcWordSm"></div><div class="fc-ar" id="fcAr"></div><div class="fc-info" id="fcInfo"></div></div></div>'+
    '</div></div>'+
    '<div class="dict" id="dictBox" hidden><input id="dictIn" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="اكتب الكلمة بالإسبانية" aria-label="اكتب الكلمة الإسبانية"><div class="dres" id="dictRes"></div><div class="seg"><button class="sbtn" id="dictGive" data-act="dictgive">لا أتذكرها</button></div></div>'+
    '<div class="fc-ctl">'+
      '<button class="fbtn" id="fcPrev" data-act="fcprev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>السابقة</button>'+
      '<button class="fbtn main" id="fcReveal" data-act="fcreveal" aria-pressed="false">إظهار المعنى</button>'+
      '<button class="fbtn" id="fcNext" data-act="fcnext">التالية<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>'+
    '</div>';
}
function fcUpdate(){
  if(!fc||!$('#fcCard'))return;
  var it=fcItem();if(!it)return;
  var n=fc.order.length;
  $('#fcCount').textContent='بطاقة '+(fc.i+1)+' من '+n;
  $('#fcProg').style.width=Math.round((fc.i+1)/n*100)+'%';
  var fw=$('#fcWord');fw.textContent=fc.dict?(it.ar||'(بدون معنى)'):it.en;fw.classList.toggle('arm',!!fc.dict);
  $('#fcTip').textContent=fc.dict?'اسمع الكلمة بزر 🔊 أو اقرأ معناها، ثم اكتبها بالإسبانية':'اضغط على البطاقة لقلبها';
  $('#fcWordSm').textContent=it.en;
  var dbx=$('#dictBox');dbx.hidden=!fc.dict;
  if(fc.dict){
    var din=$('#dictIn'),dr=$('#dictRes');
    din.disabled=fc.flipped;if(!fc.flipped&&!fc.res)din.value='';
    if(fc.res){
      var nr=fc.res.near,wb=dnorm(it.en);
      dr.className='dres '+(fc.res.ok?'ok':(nr>-1?'warn':'bad'));
      dr.innerHTML=fc.res.ok?'✅ صحيح، أحسنت':(nr>-1?'⚠️ قريب جدًا، '+(fc.res.kind==='sub'?'حرف واحد خطأ':'ينقصك حرف واحد')+'<br><b>'+esc(wb.slice(0,nr))+'<mark class="miss">'+esc(wb.charAt(nr)||'')+'</mark>'+esc(wb.slice(nr+1))+'</b>':(fc.res.give?'الكلمة: <b>'+esc(it.en)+'</b>':'❌ كتبت: <b>'+esc(fc.res.val)+'</b><br>الصحيح: <b>'+esc(it.en)+'</b>'));
    }else{dr.className='dres';dr.innerHTML=''}
    $('#dictGive').disabled=fc.flipped;
  }
  $('#fcAr').textContent=it.ar||'لا يوجد معنى لهذه الكلمة';
  $('#fcInfo').innerHTML='<span class="cat">'+esc(it.cat)+'</span>'+(it.notes?'<div class="val note">'+noteHTML(it.notes,false)+'</div>':'');
  $('#fcScene').classList.toggle('flipped',fc.flipped);
  var r=$('#fcReveal');r.textContent=fc.dict?(fc.flipped?(fc.i===n-1?'انتهت المراجعة':'التالية'):'تحقق'):(fc.flipped?'إخفاء المعنى':'إظهار المعنى');r.setAttribute('aria-pressed',String(fc.flipped));
  $('#fcPrev').disabled=fc.i===0;$('#fcNext').disabled=fc.i===n-1;
}
function fcJump(ni,dx){
  var card=$('#fcCard'),scene=$('#fcScene');
  card.classList.add('noanim');
  fc.i=ni;fc.flipped=false;fc.res=null;fcUpdate();
  void card.offsetWidth;card.classList.remove('noanim');
  scene.style.setProperty('--dx',dx+'px');
  scene.classList.remove('slide');void scene.offsetWidth;scene.classList.add('slide');
}
function dictCheck(giveUp){
  var it=fcItem();if(!it||fc.flipped)return;
  var val=($('#dictIn').value||'').trim();
  if(!giveUp&&!val){toast('اكتب الكلمة أولًا');$('#dictIn').focus();return}
  var ok=!giveUp&&dnorm(val)===dnorm(it.en),near=-1,kind='';
  if(!ok&&!giveUp){
    var a1=dnorm(val),b1=dnorm(it.en);
    if(a1.length===b1.length-1){for(var k=0;k<b1.length;k++){if(b1.slice(0,k)+b1.slice(k+1)===a1){near=k;kind='miss';break}}}
    else if(a1.length===b1.length){var df=-1,dc=0;for(var q=0;q<b1.length;q++){if(a1.charAt(q)!==b1.charAt(q)){dc++;df=q}}if(dc===1){near=df;kind='sub'}}
  }
  fc.res={ok:ok,val:val,give:!!giveUp,near:near,kind:kind};fc.flipped=true;fc.tried++;if(ok)fc.okc++;
  if(near>-1){review(it);chime('good')}else{review(it,ok);chime(ok?'good':'bad')}
  fcUpdate();
  if(fc.i===fc.order.length-1&&!fc.done){fc.done=true;examDone();setTimeout(function(){chime('end');toast('انتهيت: '+fc.okc+' صحيح من '+fc.tried)},700)}
}
function fcGo(d){
  var n=fc.order.length,ni=Math.max(0,Math.min(n-1,fc.i+d));
  if(ni!==fc.i)fcJump(ni,d>0?-20:20);
}
function testTabs(){
  var m=current==='quiz'?'quiz':(fc&&fc.dict?'dict':'cards');
  return '<div class="mini mtabs" role="tablist">'+[['cards','بطاقات'],['dict','إملاء'],['quiz','أسئلة']].map(function(x){return '<button type="button" role="tab" data-act="tmode" data-v="'+x[0]+'" aria-selected="'+(m===x[0])+'"><span>'+x[1]+'</span></button>'}).join('')+'</div>';
}
function quizBody(){return testTabs()+quizInner()}
function quizInner(){
  if(qItems().length<2)return '<div class="empty">أضف كلمتين على الأقل لتبدأ الاختبار.</div>';
  var total=quiz.pool.length;
  if(quiz.i>=total){
    var pct=Math.round(quiz.score/total*100);
    return '<div class="result"><b>'+quiz.score+' / '+total+'</b><div>'+(pct>=80?'ممتاز، حفظك قوي.':pct>=50?'جيد، راجع الكلمات التي أخطأت فيها.':'تحتاج مراجعة أكثر، أعد المحاولة.')+'</div></div><button class="btn-main" data-act="restart">اختبار جديد</button>';
  }
  var q=quiz.pool[quiz.i];
  var opts=quiz.opts.map(function(o,idx){
    var cls='opt';
    if(quiz.picked!==null){if(o===q.ar)cls+=' right';else if(idx===quiz.picked)cls+=' wrong'}
    return '<button class="'+cls+'" data-act="opt" data-i="'+idx+'"'+(quiz.picked!==null?' disabled':'')+'>'+esc(o)+'</button>';
  }).join('');
  return '<div class="q-meta"><span>السؤال '+(quiz.i+1)+' من '+total+'</span><span>الصحيح: '+quiz.score+'</span></div>'+
    '<div class="q-prog"><i style="width:'+Math.round(quiz.i/total*100)+'%"></i></div>'+
    '<div class="q-word"><b>'+esc(q.en)+'</b><button class="ibtn" data-act="qsay" aria-label="نطق">'+SPK+'</button></div>'+
    '<div class="sec-t" style="margin:0">ما معناها؟</div><div class="opts">'+opts+'</div>'+
    (quiz.picked!==null?'<button class="btn-main nextb" data-act="next">'+(quiz.i+1>=total?'النتيجة':'التالي')+'</button>':'');
}

function voiceOk(lang){
  try{
    var vs=window.speechSynthesis.getVoices()||[];
    return vs.some(function(v){return v.lang.replace('_','-').toLowerCase()===lang.toLowerCase()});
  }catch(e){return false}
}
function accentView(){
  var accents=Object.keys(LANGS).map(function(l){
    return '<button class="sbtn" data-act="accent" data-v="'+l+'" aria-pressed="'+(pref.accent===l)+'">'+LANGS[l]+'<small>'+(voiceOk(l)?'متاحة':'غير مؤكدة')+'</small></button>';
  }).join('');
  var rates=[[1,'عادية'],[0.7,'بطيئة']].map(function(r){
    return '<button class="sbtn" data-act="rate" data-v="'+r[0]+'" aria-pressed="'+(pref.rate===r[0])+'">'+r[1]+'</button>';
  }).join('');
  var snd=[[true,'مفعّلة'],[false,'مطفأة']].map(function(o){return '<button class="sbtn" data-act="sound" data-v="'+(o[0]?1:0)+'" aria-pressed="'+(soundOn()===o[0])+'">'+o[1]+'</button>'}).join('');
  var base=['zapato','gracias','ciudad'];
  var opts=base.concat(items.map(function(i){return i.en}).filter(function(w){return base.indexOf(w)<0})).map(function(w){
    return '<option'+(w===acSel?' selected':'')+'>'+esc(w)+'</option>';
  }).join('');
  var tries=Object.keys(LANGS).map(function(l){return '<button class="sbtn" data-act="try" data-v="'+l+'">🔊 '+LANGS[l]+'</button>'}).join('');
  return '<div><div class="sec-t">اللهجة الافتراضية لأزرار 🔊</div><div class="seg">'+accents+'</div></div>'+
    '<div><div class="sec-t">سرعة النطق</div><div class="seg">'+rates+'</div></div>'+
    '<div><div class="sec-t">أصوات الإنجاز (عند إكمال المراجعة أو الإجابة الصحيحة)</div><div class="seg">'+snd+'</div></div>'+
    '<div><div class="sec-t">جرّب الفرق بين اللهجات</div><select id="acWord" aria-label="اختر كلمة">'+opts+'</select><div class="seg" style="margin-top:10px">'+tries+'</div></div>'+

      '<tr><td class="l">zapato</td><td class="l">/θaˈpato/</td><td class="l">/saˈpato/</td></tr>'+
      '<tr><td class="l">gracias</td><td class="l">/ˈɡɾaθjas/</td><td class="l">/ˈɡɾasjas/</td></tr>'+
      '<tr><td class="l">ciudad</td><td class="l">/θjuˈðað/</td><td class="l">/sjuˈðað/</td></tr></table></div></div>'+
    '<div class="exnote">يعتمد صوت كل لهجة على الأصوات المثبتة في جهازك. إن لم تتوفر لهجة، يُستخدم أقرب صوت إسباني.</div>';
}

bodyOn('keydown',function(e){

  if(e.target.id==='clCode'&&e.key==='Enter'){e.preventDefault();var cb=$('[data-act="clcode"]');if(cb)cb.click();return}
  if(e.target.id==='nmIn'&&e.key==='Enter'){e.preventDefault();nmSave(e.target.value);return}
  if(e.target.id==='dictIn'&&e.key==='Enter'){e.preventDefault();if(!fc.flipped)dictCheck(false);else if(fc.i<fc.order.length-1)fcGo(1);return}
  if((e.key==='Enter'||e.key===' ')&&e.target.id==='fcCard'){e.preventDefault();fc.flipped=!fc.flipped;fcUpdate()}
});

    if(tv==='quiz'){current='quiz';startQuiz()}
    else{if(current!=='review'||!fc)fc=newFc();current='review';fc.dict=(tv==='dict');pref.fcdict=fc.dict;savePref();fc.flipped=false;fc.res=null}
    sheetFresh=true;renderSheet();sbody.scrollTop=0;
  }
  else if(a==='fcmode'){fc.dict=t.dataset.v==='1';pref.fcdict=fc.dict;savePref();fc.flipped=false;fc.res=null;renderSheet()}
  else if(a==='dictgive'){dictCheck(true)}
  else if((a==='fcflip'||a==='fcreveal')&&fc.dict){
    if(!fc.flipped){if(a==='fcreveal')dictCheck(false)}
    else if(a==='fcreveal'){if(fc.i<fc.order.length-1)fcGo(1)}
  }
  else if(a==='fcflip'||a==='fcreveal'){fc.flipped=!fc.flipped;fcUpdate();if(fc.flipped){review(fcItem());if(fc.i===fc.order.length-1&&!fc.done){fc.done=true;examDone();chime('end');toast('أكملت المراجعة 🎉')}}}
  else if(a==='fcnext')fcGo(1);
  else if(a==='fcprev')fcGo(-1);
  else if(a==='fcshuffle'){fc.order=shuffle(fc.order);fcJump(0,0)}
  else if(a==='fcsay'){var fi=fcItem();if(fi)speak(fi.en)}
  else if(a==='signin')signIn();
  else if(a==='syncnow'){if(!tokenValid()){requestToken(false)}else{syncNow().then(function(){toast(cloud.err||'تمت المزامنة')})}}
  else if(a==='signout'){
    if(t.dataset.sure){doSignOut()}
    else{
      t.dataset.sure='1';t.textContent='اضغط للتأكيد';
      setTimeout(function(){if(t.isConnected){delete t.dataset.sure;t.textContent='تسجيل الخروج'}},3000);
    }
  }
  else if(a==='export'){
    try{
      var blob=new Blob([backupJSON()],{type:'application/json'});
      var url=URL.createObjectURL(blob),dl=document.createElement('a');
      dl.href=url;dl.download='words-backup-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(dl);dl.click();document.body.removeChild(dl);
      setTimeout(function(){URL.revokeObjectURL(url)},4000);
      toast('جارٍ تنزيل النسخة الاحتياطية');
    }catch(err){toast('تعذّر التنزيل، استخدم نسخ البيانات')}
  }
  else if(a==='copyjson'){copyText(backupJSON())}
  else if(a==='import'){var it2=$('#impText');if(it2&&it2.value.trim())importData(it2.value);else toast('الصق البيانات أو اختر ملفًا أولًا')}
  else if(a==='restart'){startQuiz();renderSheet()}
  else if(a==='qsay')speak(quiz.pool[quiz.i].en);
  else if(a==='accent'){pref.accent=t.dataset.v;savePref();renderSheet();speak(acSel,pref.accent)}
  else if(a==='sound'){pref.sound=t.dataset.v==='1';savePref();renderSheet();chime('good')}
  else if(a==='rate'){pref.rate=parseFloat(t.dataset.v);savePref();renderSheet()}
  else if(a==='try'){var s=$('#acWord');speak(s?s.value:acSel,t.dataset.v)}
});
try{if('speechSynthesis' in window)window.speechSynthesis.onvoiceschanged=function(){if(current==='accent'||(page==='profile'&&!current))renderSheet()}}catch(e){}
